version: '2'
linters:
  default: all
  disable:
    - depguard
    - exhaustive
    - exhaustruct
    - exhaustruct_v5
    - gochecknoglobals
    - gochecknoinits
    - godox
    - gomodguard # deprecated
    - ireturn
    - mnd
    - nilnil
    - nlreturn
    - noinlineerr
    - paralleltest
    - varnamelen
    - wrapcheck
    - wsl
    - wsl_v5
  settings:
    gomodguard_v2:
      blocked:
        - module: encoding/json
          recommendations: [github.com/goccy/go-json]
        - module: github.com/pkg/errors
          recommendations: [errors]
    govet:
      enable-all: true
    nolintlint:
      require-specific: true
  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - legacy
    rules:
      - linters:
          - cyclop
          - err113
          - forcetypeassert
          - funlen
          - goconst
          - gosec
        path: (.+)_test.go
      - linters: [govet]
        path: ((.+)_test.go|internal/testutil/(.+))
        text: '^fieldalignment:'
      - linters: [govet]
        text: '^shadow: declaration of "err" shadows declaration'
      - linters: [revive]
        path: ((.+)_test.go|internal/testutil/(.+))
        text: '^unused-parameter:'
      - linters: [revive]
        text: '^(exported|package-comments): .*$'
      - linters: [revive]
        text: '^var-naming: avoid package names that conflict with Go standard library package names$'

formatters:
  enable:
    - gci
    - gofumpt
  settings:
    gofumpt:
      extra:
        group-params: true
        clothe-returns: true
        balance-calls: true
